<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ÀṢẸ Sprite Checker</title>
  <style>
    body {
      background-color: #0b0604;
      color: #f3e8d8;
      font-family: monospace;
      padding: 20px;
      margin: 0;
    }
    h1 {
      color: #ff6a1a;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .card {
      background-color: #1c0f06;
      border: 2px solid #ff6a1a;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      background-color: #0b0403;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .card-title {
      font-weight: bold;
      font-size: 14px;
      word-break: break-all;
    }
    .card-type {
      color: #ffab47;
      font-size: 12px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>ÀṢẸ Sprite Checker</h1>
  <div class="grid" id="grid"></div>

  <script type="module">
    // Fetch manifests to know which ones are champs and which ones are enemies
    async function load() {
      const resSpriteManifest = await fetch('assets/sprites/manifest.json');
      const spriteManifest = await resSpriteManifest.json();
      
      const resManifestIn = await fetch('tools/sprites.manifest.json');
      const manifestIn = await resManifestIn.json();
      
      const infoMap = new Map();
      for (const item of manifestIn) {
        infoMap.set(item.id, item.kind);
      }

      const grid = document.getElementById('grid');
      for (const id of spriteManifest.ids) {
        const card = document.createElement('div');
        card.className = 'card';
        
        const img = document.createElement('img');
        img.src = `assets/sprites/${id}.png`;
        img.alt = id;
        
        const title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = id;
        
        const type = document.createElement('div');
        type.className = 'card-type';
        // check if base name matches champion or enemy
        const baseId = id.split('_')[0];
        const kind = infoMap.get(baseId) || 'unknown';
        type.textContent = kind.toUpperCase();
        
        card.appendChild(img);
        card.appendChild(title);
        card.appendChild(type);
        grid.appendChild(card);
      }
    }
    load();
  </script>
</body>
</html>
